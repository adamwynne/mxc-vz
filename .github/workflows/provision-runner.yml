name: provision metal runner

# Provisions (or deletes) the Scaleway bare-metal Mac mini used as the
# vz-metal self-hosted runner — from a GitHub-hosted Linux job, so no local
# machine is needed. Dispatch-only, driven by repo secrets:
#
#   SCW_SECRET_KEY  Scaleway IAM API secret key
#   SCW_PROJECT_ID  Scaleway project ID
#   RUNNER_PAT      GitHub PAT with admin on this repo (mints the runner
#                   registration token)
#
# COST: Scaleway Apple Silicon has a 24-HOUR MINIMUM allocation (~EUR 5.30
# for an M4 even if deleted immediately after the minimum elapses).
on:
  workflow_dispatch:
    inputs:
      action:
        description: create or delete
        type: choice
        options: [create, delete]
        default: create
      server_id:
        description: server ID (required for delete)
        required: false
        default: ""
  # Stock-retry schedule DISABLED (2026-08-17): a local Apple Silicon Mac is
  # available for VZ validation, so we no longer poll Scaleway for capacity.
  # Manual dispatch (create/delete) is kept for on-demand use. To re-enable
  # the unattended retry, restore:
  #   schedule:
  #     - cron: "*/30 * * * *"

# Never let a scheduled tick race a provision already in flight.
concurrency:
  group: provision-runner
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
      GH_PAT: ${{ secrets.RUNNER_PAT }}
      GH_REPO: ${{ github.repository }}
      # Scheduled runs have no inputs; they always mean "create".
      ACTION: ${{ inputs.action || 'create' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -n "$SCW_SECRET_KEY" ] || missing="$missing SCW_SECRET_KEY"
          [ -n "$SCW_PROJECT_ID" ] || missing="$missing SCW_PROJECT_ID"
          if [ "$ACTION" = "create" ] && [ -z "$GH_PAT" ]; then missing="$missing RUNNER_PAT"; fi
          if [ -n "$missing" ]; then
            echo "::error title=missing repo secrets::Add these under Settings -> Secrets and variables -> Actions:$missing"
            exit 1
          fi

      - name: Delete server
        if: env.ACTION == 'delete'
        run: |
          test -n "${{ inputs.server_id }}" || { echo "::error::server_id input is required for delete"; exit 1; }
          ./scripts/provision-scaleway-runner.sh delete "${{ inputs.server_id }}"
          echo "### Scaleway server ${{ inputs.server_id }} deletion requested" >> "$GITHUB_STEP_SUMMARY"
          echo "Also deregister the runner under Settings -> Actions -> Runners." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate and register SSH key
        if: env.ACTION == 'create'
        run: |
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -C "mxc-vz-gha-${{ github.run_id }}"
          pubkey="$(cat ~/.ssh/id_ed25519.pub)"
          # Register in Scaleway IAM so the Mac provisions with this key.
          response="$(curl -fsS -X POST \
            -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" \
            -d "{\"name\": \"mxc-vz-gha-${{ github.run_id }}\", \"public_key\": \"$pubkey\", \"project_id\": \"$SCW_PROJECT_ID\"}" \
            https://api.scaleway.com/iam/v1alpha1/ssh-keys)"
          key_id="$(echo "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "SCW_SSH_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "SSH key registered with Scaleway IAM ($key_id)"

      - name: Provision Mac and register runner
        if: env.ACTION == 'create'
        run: |
          set -o pipefail
          set +e
          ./scripts/provision-scaleway-runner.sh | tee provision.log
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            # Transient no-stock: keep scheduled retries green and quiet.
            echo "### No Apple Silicon stock this attempt — will retry on schedule" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" = "0" ] || exit "$code"
          server_line="$(grep -E '^server ready:' provision.log || true)"
          {
            echo "### vz-metal runner provisioning"
            echo ""
            echo "\`$server_line\`"
            echo ""
            echo "**Billing: 24-hour minimum.** Delete with the delete action of this workflow"
            echo "(server id is in the line above), then deregister the runner under"
            echo "Settings -> Actions -> Runners."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up unused SSH key
        # Every scheduled tick registers a key; without cleanup, no-stock
        # ticks accumulate dozens of stale IAM keys (and could eventually
        # hit an IAM key limit). Keep the key only if a server was created
        # with it (it is that machine's access key).
        if: always() && env.ACTION == 'create' && env.SCW_SSH_KEY_ID != ''
        run: |
          if [ -f provision.log ] && grep -q '^server ready:' provision.log; then
            echo "server created — keeping SSH key $SCW_SSH_KEY_ID"
          else
            curl -fsS -X DELETE -H "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/iam/v1alpha1/ssh-keys/$SCW_SSH_KEY_ID" \
              && echo "deleted unused SSH key $SCW_SSH_KEY_ID" \
              || echo "warning: could not delete SSH key $SCW_SSH_KEY_ID (clean up manually in IAM)"
          fi
