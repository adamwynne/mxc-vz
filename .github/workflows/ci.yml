name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux tests + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Validate probe policies
        # Every sentinel probe (tests/probes/README.md) is a vz policy that
        # must parse and validate — or be REJECTED for validation probes
        # marked with a .reject file (fail-closed checks, e.g. TM-04).
        run: |
          status=0
          for f in tests/probes/*/*.json; do
            base="${f%.json}"
            if [ -e "$base.reject" ]; then
              if cargo run -q -p vz_common --example vz_validate -- "$f"; then
                echo "::error title=validation probe failed open::$f must be rejected by vz_validate"
                status=1
              else
                echo "rejected as expected: $f"
              fi
            else
              if cargo run -q -p vz_common --example vz_validate -- "$f"; then
                echo "accepted: $f"
              else
                echo "::error title=probe policy invalid::$f failed vz_validate"
                status=1
              fi
            fi
          done
          exit "$status"

  guest-image:
    # Phase 2 + the plan's milestone without a Mac: build the guest image,
    # boot it under QEMU (TCG emulation), and run a real exec through the
    # framed protocol against the real agent as PID-1-started init.
    name: guest image build + QEMU exec milestone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build guest image
        run: ./scripts/build-vz-guest.sh guest
      - name: Upload guest image artifact
        uses: actions/upload-artifact@v4
        with:
          name: vz-guest-image
          path: |
            guest/vmlinux
            guest/initramfs.cpio.gz
            guest/manifest.json
          if-no-files-found: error
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: Boot guest under QEMU
        # QEMU stays up across the milestone step AND the sentinel-probe
        # step below; the always() cleanup step kills it via the PID file.
        run: |
          cargo build -p vz_protocol --example exec_tcp
          qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512 -nographic \
            -kernel guest/vmlinux -initrd guest/initramfs.cpio.gz \
            -append "console=ttyAMA0 mxc_agent_listen=tcp:0.0.0.0:7777" \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:7777-:7777 \
            -device virtio-net-pci,netdev=n0 \
            > qemu-console.log 2>&1 &
          echo "$!" > qemu.pid
      - name: QEMU exec milestone (echo through the protocol)
        timeout-minutes: 15
        run: |
          set +e
          output="$(target/debug/examples/exec_tcp 127.0.0.1:7777 'echo hi from the vz guest' 300)"
          code=$?
          set -e
          echo "--- exec output: '$output' (exit $code) ---"
          if [ "$code" != "0" ] || [ "$output" != "hi from the vz guest" ]; then
            echo "::error title=QEMU exec milestone failed::exit=$code output='$output'"
            exit 1
          fi
          echo "### QEMU milestone: booted the guest image and ran echo through the exec protocol :rocket:" >> "$GITHUB_STEP_SUMMARY"
      - name: SDK executor against the booted guest (vz-exec)
        # Phase 5: the exact binary the SDK spawns for containment "vz",
        # driven with the same policy the portability job executes under
        # bubblewrap — flipped to vz — via the testing transport into the
        # SAME booted guest. Asserts stdout and exit-code passthrough.
        timeout-minutes: 10
        run: |
          cargo build -p vz_exec
          python3 - <<'PY'
          import json
          policy = json.load(open("tests/portability/exec-parity.json"))
          policy["containment"] = "vz"
          json.dump(policy, open("exec-parity-vz.json", "w"))
          PY
          set +e
          output="$(MXC_VZ_AGENT_TCP=127.0.0.1:7777 target/debug/vz-exec \
            --config exec-parity-vz.json --experimental --allow-testing-features)"
          code=$?
          set -e
          echo "--- vz-exec output: '$output' (exit $code) ---"
          if [ "$code" != "0" ] || ! echo "$output" | grep -q "hi from the vz guest"; then
            echo "::error title=vz-exec executor run failed::exit=$code output='$output'"
            exit 1
          fi
          echo "### vz-exec: the SDK executor ran the portability policy against the guest" >> "$GITHUB_STEP_SUMMARY"
      - name: Guest-local sentinel probes
        # tests/probes/README.md — policy-driven isolation probes running
        # inside the SAME booted guest (the milestone above already proved
        # readiness, so a short per-probe retry budget suffices).
        timeout-minutes: 10
        run: RETRY_SECS=60 scripts/run-guest-probes.sh 127.0.0.1:7777 tests/probes/guest-local
      - name: Stop QEMU and dump console
        if: always()
        run: |
          if [ -f qemu.pid ]; then
            kill "$(cat qemu.pid)" 2>/dev/null || true
          fi
          echo "--- guest console (tail) ---"
          tail -60 qemu-console.log 2>/dev/null || true
      - name: Egress gate e2e (QEMU dgram netdev through the vz_net gate)
        # The allowedHosts datapath against the REAL guest: this boot's only
        # NIC is a datagram netdev whose frames all cross the gate_udp
        # example (the same vz_net::gate the VZ file-handle attachment
        # uses). The guest probes with wget and prints MXC_EGRESS_*
        # sentinels: allowed name fetches through DNS proxy + NAT; a denied
        # IP gets an RST; a non-allow-listed name is refused at DNS.
        timeout-minutes: 15
        run: |
          cargo build -p vz_net --example gate_udp
          mkdir -p egress-www && echo "gate-ok" > egress-www/ok.txt
          (cd egress-www && python3 -m http.server 18080 --bind 127.0.0.1 > ../http-server.log 2>&1) &
          echo "$!" > http.pid
          target/debug/examples/gate_udp \
            --bind 127.0.0.1:17777 --peer 127.0.0.1:17778 \
            --allow echo.test --resolve echo.test=127.0.0.1 \
            > gate.log 2>&1 &
          echo "$!" > gate.pid
          qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512 -nographic -no-reboot \
            -kernel guest/vmlinux -initrd guest/initramfs.cpio.gz \
            -append "console=ttyAMA0 mxc_net=static mxc_probe_egress=http://echo.test:18080/ok.txt,http://10.9.9.9:9/x,http://evil.test:80/x" \
            -netdev dgram,id=gn0,local.type=inet,local.host=127.0.0.1,local.port=17778,remote.type=inet,remote.host=127.0.0.1,remote.port=17777 \
            -device virtio-net-pci,netdev=gn0 \
            > egress-console.log 2>&1 &
          echo "$!" > qemu-egress.pid
          for _ in $(seq 1 150); do
            if grep -q "MXC_EGRESS_PROBE_COMPLETE" egress-console.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "--- egress console (tail) ---"
          tail -40 egress-console.log || true
          echo "--- gate log ---"
          cat gate.log || true
          status=0
          for sentinel in MXC_EGRESS_ALLOWED_OK MXC_EGRESS_DENIED_OK MXC_EGRESS_REFUSED_OK; do
            if grep -q "$sentinel" egress-console.log; then
              echo "ok: $sentinel"
            else
              echo "::error title=egress gate probe failed::$sentinel not found in guest console"
              status=1
            fi
          done
          [ "$status" = "0" ] && echo "### Egress gate e2e: real guest, real gate — allowed fetched, denied RST, refused at DNS :lock:" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Stop egress gate processes
        if: always()
        run: |
          for pidfile in qemu-egress.pid gate.pid http.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

  portability:
    # Cross-backend portability contract (build plan, Phase 5), executed:
    # the SAME policy JSON runs for real under upstream mxc's bubblewrap
    # backend on Linux, then — with only `containment` flipped to "vz" —
    # must be accepted by our vz validation. The workload output must also
    # match what the QEMU guest-exec milestone produces, giving behavior
    # parity across a Linux mxc backend and the vz guest.
    name: cross-backend portability (bubblewrap vs vz)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MXC_UPSTREAM_REF: 692275b84eaa3f83cd8582dc774bc5f354f46ccf
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream microsoft/mxc (pinned)
        uses: actions/checkout@v4
        with:
          repository: microsoft/mxc
          ref: 692275b84eaa3f83cd8582dc774bc5f354f46ccf
          path: upstream-mxc
      - name: Install bubblewrap + lxc headers
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap liblxc-dev
          # Ubuntu 24.04 runners block unprivileged user namespaces via
          # AppArmor, which breaks bwrap's netns setup (RTM_NEWADDR EPERM).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Cache upstream build
        uses: actions/cache@v4
        with:
          path: upstream-mxc/src/target
          key: upstream-lxc-exec-${{ env.MXC_UPSTREAM_REF }}-${{ runner.os }}
      - name: Build upstream lxc-exec
        run: cargo build --release -p lxc
        working-directory: upstream-mxc/src
      - name: Execute the policy under bubblewrap (upstream)
        run: |
          EXEC="$(find upstream-mxc/src/target/release -maxdepth 1 -name lxc-exec -type f)"
          test -n "$EXEC" || { echo "::error::lxc-exec not built"; exit 1; }
          encoded="$(base64 -w0 tests/portability/exec-parity.json)"
          set +e
          output="$("$EXEC" --config-base64 "$encoded" 2>bwrap-stderr.log)"
          code=$?
          set -e
          echo "--- bubblewrap stderr ---"; cat bwrap-stderr.log || true
          echo "--- bubblewrap stdout: '$output' (exit $code) ---"
          if [ "$code" != "0" ] || ! echo "$output" | grep -q "hi from the vz guest"; then
            echo "::error title=bubblewrap execution failed::exit=$code output='$output'"
            exit 1
          fi
      - name: Validate the same policy under vz (containment flipped)
        run: |
          python3 - <<'PY'
          import json
          policy = json.load(open("tests/portability/exec-parity.json"))
          policy["containment"] = "vz"
          json.dump(policy, open("exec-parity-vz.json", "w"))
          PY
          cargo run -p vz_common --example vz_validate -- exec-parity-vz.json
          echo "### Portability: same policy executed under bubblewrap and accepted by vz validation" >> "$GITHUB_STEP_SUMMARY"

  macos:
    # Phase 1 boot milestone. The build plan asserts GitHub's macOS ARM64
    # runners (macos-14+) support Virtualization.framework; the boot-smoke
    # step tests that claim empirically on each image. "Unsupported runner"
    # is reported softly (the claim failed, not the code); a boot failure on
    # a supported runner fails the job.
    name: macos build + boot smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Host virtualization diagnostics
        run: |
          sw_vers
          uname -m
          sysctl -a 2>/dev/null | grep -iE 'hv_|hv\.' || echo "(no kern.hv sysctls visible)"
      - name: Build, unit-test, and ad-hoc sign (build-mac.sh)
        run: ./build-mac.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: SDK platform probe (vz-exec --probe)
        # The getPlatformSupport analogue. On GH-hosted runners (VMs) this
        # honestly reports unsupported; the contract is JSON + exit 0. An
        # unsigned build would be SIGKILLed here — build-mac.sh signed it.
        run: |
          probe="$(target/debug/vz-exec --probe)"
          echo "probe: $probe"
          echo "$probe" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("isSupported:", d["isSupported"])'
      - name: Fetch Alpine guest artifacts
        run: ./scripts/fetch-alpine-guest.sh guest
      - name: Boot smoke
        timeout-minutes: 10
        run: |
          set +e
          target/debug/examples/boot_smoke guest/vmlinux guest/initramfs-virt
          code=$?
          set -e
          case "$code" in
            0)
              echo "### vz boot smoke (${{ matrix.runner }}): booted OK :rocket:" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::warning title=vz unsupported on ${{ matrix.runner }}::VZVirtualMachine.isSupported returned false — the build plan's nested-virtualization assumption does not hold on this runner image"
              echo "### vz boot smoke (${{ matrix.runner }}): SKIPPED — runner lacks Virtualization.framework support" >> "$GITHUB_STEP_SUMMARY"
              ;;
            137)
              echo "::error title=boot_smoke SIGKILLed::The binary was killed on first VZ API use — almost always a missing/stripped com.apple.security.virtualization signature (build-mac.sh signs after building; a bare cargo rebuild strips it)"
              exit 1
              ;;
            *)
              echo "::error title=vz boot smoke failed (exit $code)::VZ is supported on this runner but the boot failed — this is a real Phase 1 regression"
              exit "$code"
              ;;
          esac
