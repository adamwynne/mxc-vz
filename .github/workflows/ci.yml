name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux tests + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  guest-image:
    # Phase 2 + the plan's milestone without a Mac: build the guest image,
    # boot it under QEMU (TCG emulation), and run a real exec through the
    # framed protocol against the real agent as PID-1-started init.
    name: guest image build + QEMU exec milestone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build guest image
        run: ./scripts/build-vz-guest.sh guest
      - name: Upload guest image artifact
        uses: actions/upload-artifact@v4
        with:
          name: vz-guest-image
          path: |
            guest/vmlinux
            guest/initramfs.cpio.gz
            guest/manifest.json
          if-no-files-found: error
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: Boot guest and exec through the protocol
        timeout-minutes: 15
        run: |
          cargo build -p vz_protocol --example exec_tcp
          qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512 -nographic \
            -kernel guest/vmlinux -initrd guest/initramfs.cpio.gz \
            -append "console=ttyAMA0 mxc_agent_listen=tcp:0.0.0.0:7777" \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:7777-:7777 \
            -device virtio-net-pci,netdev=n0 \
            > qemu-console.log 2>&1 &
          QEMU_PID=$!
          set +e
          output="$(target/debug/examples/exec_tcp 127.0.0.1:7777 'echo hi from the vz guest' 300)"
          code=$?
          set -e
          kill "$QEMU_PID" 2>/dev/null || true
          echo "--- guest console (tail) ---"
          tail -40 qemu-console.log || true
          echo "--- exec output: '$output' (exit $code) ---"
          if [ "$code" != "0" ] || [ "$output" != "hi from the vz guest" ]; then
            echo "::error title=QEMU exec milestone failed::exit=$code output='$output'"
            exit 1
          fi
          echo "### QEMU milestone: booted the guest image and ran echo through the exec protocol :rocket:" >> "$GITHUB_STEP_SUMMARY"

  portability:
    # Cross-backend portability contract (build plan, Phase 5), executed:
    # the SAME policy JSON runs for real under upstream mxc's bubblewrap
    # backend on Linux, then — with only `containment` flipped to "vz" —
    # must be accepted by our vz validation. The workload output must also
    # match what the QEMU guest-exec milestone produces, giving behavior
    # parity across a Linux mxc backend and the vz guest.
    name: cross-backend portability (bubblewrap vs vz)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MXC_UPSTREAM_REF: 692275b84eaa3f83cd8582dc774bc5f354f46ccf
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream microsoft/mxc (pinned)
        uses: actions/checkout@v4
        with:
          repository: microsoft/mxc
          ref: 692275b84eaa3f83cd8582dc774bc5f354f46ccf
          path: upstream-mxc
      - name: Install bubblewrap + lxc headers
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap liblxc-dev
          # Ubuntu 24.04 runners block unprivileged user namespaces via
          # AppArmor, which breaks bwrap's netns setup (RTM_NEWADDR EPERM).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Cache upstream build
        uses: actions/cache@v4
        with:
          path: upstream-mxc/src/target
          key: upstream-lxc-exec-${{ env.MXC_UPSTREAM_REF }}-${{ runner.os }}
      - name: Build upstream lxc-exec
        run: cargo build --release -p lxc
        working-directory: upstream-mxc/src
      - name: Execute the policy under bubblewrap (upstream)
        run: |
          EXEC="$(find upstream-mxc/src/target/release -maxdepth 1 -name lxc-exec -type f)"
          test -n "$EXEC" || { echo "::error::lxc-exec not built"; exit 1; }
          encoded="$(base64 -w0 tests/portability/exec-parity.json)"
          set +e
          output="$("$EXEC" --config-base64 "$encoded" 2>bwrap-stderr.log)"
          code=$?
          set -e
          echo "--- bubblewrap stderr ---"; cat bwrap-stderr.log || true
          echo "--- bubblewrap stdout: '$output' (exit $code) ---"
          if [ "$code" != "0" ] || ! echo "$output" | grep -q "hi from the vz guest"; then
            echo "::error title=bubblewrap execution failed::exit=$code output='$output'"
            exit 1
          fi
      - name: Validate the same policy under vz (containment flipped)
        run: |
          python3 - <<'PY'
          import json
          policy = json.load(open("tests/portability/exec-parity.json"))
          policy["containment"] = "vz"
          json.dump(policy, open("exec-parity-vz.json", "w"))
          PY
          cargo run -p vz_common --example vz_validate -- exec-parity-vz.json
          echo "### Portability: same policy executed under bubblewrap and accepted by vz validation" >> "$GITHUB_STEP_SUMMARY"

  macos:
    # Phase 1 boot milestone. The build plan asserts GitHub's macOS ARM64
    # runners (macos-14+) support Virtualization.framework; the boot-smoke
    # step tests that claim empirically on each image. "Unsupported runner"
    # is reported softly (the claim failed, not the code); a boot failure on
    # a supported runner fails the job.
    name: macos build + boot smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Host virtualization diagnostics
        run: |
          sw_vers
          uname -m
          sysctl -a 2>/dev/null | grep -iE 'hv_|hv\.' || echo "(no kern.hv sysctls visible)"
      - name: Build, unit-test, and ad-hoc sign (build-mac.sh)
        run: ./build-mac.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Fetch Alpine guest artifacts
        run: ./scripts/fetch-alpine-guest.sh guest
      - name: Boot smoke
        timeout-minutes: 10
        run: |
          set +e
          target/debug/examples/boot_smoke guest/vmlinux guest/initramfs-virt
          code=$?
          set -e
          case "$code" in
            0)
              echo "### vz boot smoke (${{ matrix.runner }}): booted OK :rocket:" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::warning title=vz unsupported on ${{ matrix.runner }}::VZVirtualMachine.isSupported returned false — the build plan's nested-virtualization assumption does not hold on this runner image"
              echo "### vz boot smoke (${{ matrix.runner }}): SKIPPED — runner lacks Virtualization.framework support" >> "$GITHUB_STEP_SUMMARY"
              ;;
            137)
              echo "::error title=boot_smoke SIGKILLed::The binary was killed on first VZ API use — almost always a missing/stripped com.apple.security.virtualization signature (build-mac.sh signs after building; a bare cargo rebuild strips it)"
              exit 1
              ;;
            *)
              echo "::error title=vz boot smoke failed (exit $code)::VZ is supported on this runner but the boot failed — this is a real Phase 1 regression"
              exit "$code"
              ;;
          esac
