name: guest image bump

# Checks whether Alpine has published new netboot artifacts for the pinned
# branch and, if so, opens a PR updating scripts/guest-pins.json. CI on that
# PR (the QEMU boot + exec milestone job) validates the new kernel/initramfs
# before anyone merges — routine guest patching becomes "review a green PR".
#
# Uses RUNNER_PAT to push and open the PR so the PR's own CI runs (PRs
# created with the default GITHUB_TOKEN do not trigger workflows).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_PAT: ${{ secrets.RUNNER_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current Alpine artifacts and rewrite pins
        run: GUEST_PINS_UPDATE=1 ./scripts/fetch-alpine-guest.sh bump-tmp
      - name: Open bump PR if pins changed
        run: |
          if git diff --quiet scripts/guest-pins.json; then
            echo "### Guest pins are current — no bump needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$GH_PAT" || { echo "::error::RUNNER_PAT secret is required to open the bump PR"; exit 1; }
          branch="bump/guest-pins-$(date -u +%Y%m%d)"
          git config user.name "mxc-vz guest bump"
          git config user.email "noreply@users.noreply.github.com"
          git checkout -B "$branch"
          git add scripts/guest-pins.json
          git commit -m "Bump pinned Alpine guest artifacts" \
            -m "Automated pin refresh: Alpine published new netboot artifacts for the pinned branch. CI on this PR re-validates the guest image end to end (QEMU boot + exec milestone) before merge."
          git push --force -u "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          response="$(curl -sS -o /tmp/pr.json -w '%{http_code}' -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "{\"title\": \"Bump pinned Alpine guest artifacts\", \
                 \"head\": \"$branch\", \"base\": \"main\", \
                 \"body\": \"Automated guest-image pin refresh. Merge once CI (including the QEMU boot + exec milestone) is green.\\n\\n---\\n_Generated by [Claude Code](https://claude.ai/code)_\"}")"
          case "$response" in
            201)
              url="$(python3 -c 'import json; print(json.load(open("/tmp/pr.json"))["html_url"])')"
              echo "### Opened guest pin bump PR: $url" >> "$GITHUB_STEP_SUMMARY"
              ;;
            422)
              echo "### Bump branch updated; a PR for it already exists" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::PR creation failed (HTTP $response)"; cat /tmp/pr.json; exit 1
              ;;
          esac
