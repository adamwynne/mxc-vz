[workspace]
resolver = "2"
members = [
    "src/backends/vz/vz_common",
    "src/backends/vz/vz_darwin",
    "src/backends/vz/vz_guest_agent",
    "src/backends/vz/vz_protocol",
]

[workspace.package]
version = "0.8.0-dev"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
